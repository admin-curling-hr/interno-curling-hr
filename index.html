<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Interno — Hrvatski curling savez</title>
<link rel="icon" href="https://curling.hr/assets/images/hcs-logo.png">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/theme.js"></script>
</head>
<body data-module="">
<main>
  <div id="module" hidden>
    <h1 class="page-title" id="greeting">Dobro došli</h1>
    <p class="page-lead">Odaberite što želite raditi.</p>
    <div class="tiles" id="tiles"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="assets/shell.js"></script>
<script>
"use strict";
Shell.ready.then(({ account }) => {
  const esc = Shell.esc;
  const first = String(account.name || "").split(" ")[0];
  if (first) document.getElementById("greeting").textContent = "Dobro došli, " + first;
  document.getElementById("tiles").innerHTML = Shell.menu().map((m) =>
    '<section class="card tile"><h2><a href="' + esc(m.url) + '">' + esc(m.label) + "</a></h2>" +
    "<p>" + esc(m.desc || "") + "</p></section>").join("");
});
</script>
</body>
</html>
